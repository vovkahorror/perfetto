<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <!-- Шаблон кавового зерна -->
    <g id="bean">
      <g transform="rotate(30)">
        <ellipse cx="0" cy="0" rx="16" ry="26" fill="#6a3e2e" stroke="#000" stroke-width="3.5"/>
        <path d="M -5 -20 Q 12 -5 -2 0 T 5 20" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    
    <!-- CSS-анімація -->
    <style>
      .anim-layer { 
        animation: bounce 1.2s infinite ease-in-out; 
      }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 0.15s; }
      .d3 { animation-delay: 0.3s; }
      .d4 { animation-delay: 0.45s; }
      
      @keyframes bounce {
        0%, 100% { 
          transform: translateY(0); 
          opacity: 0.5; 
        }
        50% { 
          transform: translateY(-12px); 
          opacity: 1; 
        }
      }
    </style>
  </defs>

  <!-- Розміщення зерен із застосуванням анімації -->
  <g transform="translate(40, 60)">
    <g class="anim-layer d1"><use href="#bean" /></g>
  </g>
  <g transform="translate(90, 60)">
    <g class="anim-layer d2"><use href="#bean" /></g>
  </g>
  <g transform="translate(140, 60)">
    <g class="anim-layer d3"><use href="#bean" /></g>
  </g>
  <g transform="translate(190, 60)">
    <g class="anim-layer d4"><use href="#bean" /></g>
  </g>
</svg>
